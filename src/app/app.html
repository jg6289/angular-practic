<main class="max-w-3xl mx-auto px-4 py-8 grid gap-8">
  <h1 class="text-2xl font-bold m-0">sf-choice-field 布局</h1>
  <p class="text-sm text-gray-500 m-0">虛線框寬 360px。</p>

    <section class="grid gap-4 p-6 bg-white border border-gray-200 rounded-xl">
    <div class="flex flex-wrap gap-6">

      <!-- 狀態：button-group -->
      <div class="w-[360px] p-3 border border-dashed border-gray-400 grid gap-1.5">
        <label class="text-sm font-bold">狀態</label>
        <sf-choice-field displayMode="button-group" [options]="statuses" [(value)]="status" />
      </div>

      <!-- 部門：select -->
      <div class="w-[360px] p-3 border border-dashed border-gray-400 grid gap-1.5">
        <label class="text-sm font-bold">部門</label>
        <sf-choice-field displayMode="select" placeholder="請選擇部門" [options]="depts" [(value)]="dept" />
      </div>

      <!-- 城市：popover -->
      <div class="w-[360px] p-3 border border-dashed border-gray-400 grid gap-1.5">
        <label class="text-sm font-bold">城市</label>
        <sf-choice-field displayMode="popover" placeholder="請選擇" [options]="cities" [(value)]="city" />
      </div>

    </div>
    <p class="text-sm text-gray-500 m-0">狀態：{{ status() }}　部門：{{ dept() }}　城市：{{ city() }}</p>
  </section>
  
  
<section>
  <h2>範例 1：&#64;theme（改 --color-brand，四種元素一起變色）</h2>
  <div class="flex flex-wrap items-center gap-4">
    <button class="px-4 py-2 rounded-brand border border-brand bg-brand text-white">按鈕</button>
    <span class="px-4 py-2 rounded-full text-sm text-brand border border-brand">標籤</span>
    <a class="text-brand underline">文字連結</a>
    <div class="px-4 py-3 border-l-4 border-brand bg-gray-50 text-sm">對比區塊</div>
  </div>
</section>

<section>
  <h2>範例 2：&#64;utility（改 demo-option，所有按鈕一起變）</h2>
  <div class="flex gap-2">
    <button class="demo-option">研發部</button>
    <button class="demo-option">業務部</button>
    <button class="demo-option">管理部</button>
    <button>對比</button>
  </div>
</section>

</main>
